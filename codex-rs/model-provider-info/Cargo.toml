[package]
edition.workspace = true
license.workspace = true
name = "codex-model-provider-info"
version.workspace = true

[lib]
doctest = false
name = "codex_model_provider_info"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
runtime = [
    "dep:codex-api",
    "dep:codex-app-server-protocol",
    "dep:codex-protocol",
    "dep:http",
]

[dependencies]
codex-api = { workspace = true, optional = true }
codex-app-server-protocol = { workspace = true, optional = true }
codex-config-types = { workspace = true }
codex-protocol = { workspace = true, optional = true }
http = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
codex-utils-absolute-path = { workspace = true }
maplit = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
