[package]
name = "codex-thread-config-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[[example]]
name = "generate-proto"
path = "examples/generate-proto.rs"

[lib]
name = "codex_thread_config_remote"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
codex-config = { workspace = true }
codex-config-types = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-utils-absolute-path = { workspace = true }
prost = "0.14.3"
tonic = { workspace = true }
tonic-prost = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["router", "transport"] }
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
