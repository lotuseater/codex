[package]
name = "codex-tui-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_tui_render"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-ansi-escape = { workspace = true }
codex-git-utils = { workspace = true }
codex-install-context = { workspace = true }
codex-permission-types = { workspace = true }
codex-protocol = { workspace = true }
codex-runtime-metrics-types = { workspace = true }
codex-shell-command = { workspace = true }
codex-terminal-detection = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-cli = { workspace = true }
codex-utils-elapsed = { workspace = true }
codex-utils-string = { workspace = true }
crossterm = { workspace = true }
diffy = { workspace = true }
dirs = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }
itertools = { workspace = true }
pathdiff = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true, features = [
    "scrolling-regions",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
ratatui-macros = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
shlex = { workspace = true }
supports-color = { workspace = true }
syntect = { workspace = true }
textwrap = { workspace = true }
tracing = { workspace = true, features = ["log"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
